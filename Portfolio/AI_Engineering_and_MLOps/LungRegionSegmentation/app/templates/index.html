<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lung Segmentation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 30px; background: #f8f9fa; text-align: center; }
        h1 { margin-bottom: 30px; }
        .images-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .images-container img {
            width: 400px;    /* même largeur pour toutes les images */
            height: 400px;   /* même hauteur pour toutes les images */
            object-fit: cover; /* garde le ratio en remplissant le cadre */
            border: 2px solid #dee2e6;
            border-radius: 8px;
        }
        .caption { margin-top: 5px; font-weight: bold; }
        .btn-success { background-color: #28a745 !important; } /* vert Bootstrap */
    </style>
</head>
<body>
    <div class="container">
        <h1>Lung Segmentation Web App</h1>
        <form action="/predict_web" method="post" enctype="multipart/form-data" class="mb-4">
            <input type="file" name="image" class="form-control-file" required>
            <button type="submit" class="btn btn-success mt-2">Segment</button>
        </form>

        {% if original and result %}
        <div class="images-container">
            <div>
                <img src="{{ url_for('static', filename=original) }}" alt="Original Image">
                <div class="caption">Original Image</div>
            </div>
            <div>
                <img src="{{ url_for('static', filename=result) }}" alt="Segmented Overlay">
                <div class="caption">Segmented Overlay</div>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
