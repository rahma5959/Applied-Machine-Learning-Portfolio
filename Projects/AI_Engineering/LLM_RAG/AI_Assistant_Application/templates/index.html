
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .response {
            white-space: pre-wrap;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>AI Assistant</h1>

    <form action="/generate" method="POST">

        <textarea
            name="prompt"
            placeholder="Write your question here..."
            required
        >{{ prompt or "" }}</textarea>

        <br>

        <button type="submit">
            Generate
        </button>

    </form>

    {% if response %}

    <div class="result">

        <h2>Result</h2>

        <div class="response">
            {{ response }}
        </div>

    </div>

    {% endif %}
    

</body>

</html>
